[project]
name = "remediation-rag"
version = "0.1.0"
description = "Self-correcting security remediation RAG: Bedrock generation gated by Jev decisions, orchestrated with LangGraph."
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "langgraph>=0.2.60",
    "langchain-core>=0.3.30",
    "langchain-text-splitters>=0.3.5",
    "langchain-aws>=0.2.10",
    "langchain-pinecone>=0.2.2",
    "pinecone>=5.4",
    "boto3>=1.35",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-pyyaml>=6.0",
]

[project.scripts]
remediation-ingest = "remediation_rag.ingestion.pipeline:main"
remediation-eval = "remediation_rag.eval.harness:main"
remediation-demo = "remediation_rag.demo:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["remediation_rag"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["remediation_rag/ingestion/seed"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "ASYNC"]
ignore = ["RUF012"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
exclude = ["remediation_rag/ingestion/seed/"]
