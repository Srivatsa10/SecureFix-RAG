services:
  backend:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      APP_MODE: ${APP_MODE:-offline}
      JEV_MODE: ${JEV_MODE:-mock}
    ports:
      - "8000:8000"
    volumes:
      - owasp-cache:/app/data

  frontend:
    build: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:80"

volumes:
  owasp-cache:
